services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: ["sh", "-c", "cd /app/src && g++ adapter.cpp routing.cpp file.cpp -o RoutingAdapter && cd /app && exec python web/app.py"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
